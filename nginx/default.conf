# Group of backend servers. 'web' = the Flask service name in docker-compose.yml;
# Docker's internal DNS turns it into the container's IP address.
upstream web_app {
    server web:5000;
}

server {
    # Listen on port 80 (HTTP) for any hostname or IP.
    listen 80;
    server_name _;

    # Hide the Nginx version number (security).
    server_tokens off;

    # Health checks: don't fill the logs with them.
    location = /health {
        access_log off;
        proxy_pass http://web_app;
    }

    # Everything else goes to the Flask app.
    location / {
        proxy_pass http://web_app;
        # Pass the original visitor details to the app:
        proxy_set_header Host              $host;                       # original hostname
        proxy_set_header X-Real-IP         $remote_addr;                # visitor's real IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # chain of proxies
        proxy_set_header X-Forwarded-Proto $scheme;                     # http or https
    }
}
