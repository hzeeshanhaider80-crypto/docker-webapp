
# Project name
name: docker-webapp

services:

  # 1. Flask Web Application
  web:
    image: ${WEB_IMAGE:-docker-webapp:local}

    build:
      context: ./app
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      APP_VERSION: ${APP_VERSION:-local}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend

    # Health check is inherited from the Dockerfile.

  # 2. Redis Database
  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - backend

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:1.27-alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      web:
        condition: service_healthy

    networks:
      - backend

# Persistent Redis storage
volumes:
  redis-data:

# Private application network
networks:
  backend:
    driver: bridge
